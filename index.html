<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Advance Management System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body.login-body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .login-header h2 {
            color: #1e293b;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.3;
        }
        .login-header .sub-title {
            display: block;
            font-size: 13px;
            color: #007bff;
            font-weight: 600;
            margin-top: 4px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #475569;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #007bff;
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            padding-right: 40px;
        }
        .toggle-pwd {
            position: absolute;
            right: 12px;
            cursor: pointer;
            user-select: none;
            font-size: 16px;
            opacity: 0.7;
        }
        .toggle-pwd:hover {
            opacity: 1;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .forgot-link {
            display: block;
            margin-top: 14px;
            text-align: right;
            font-size: 13px;
            color: #007bff;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .close-btn {
            float: right;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
            color: #64748b;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <h2>EMPLOYEE<br><span class="sub-title">ADVANCE MANAGEMENT SYSTEM</span></h2>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <span class="toggle-pwd" id="togglePassword">👁️</span>
                </div>
            </div>
            <button type="submit" class="btn-primary">Login</button>
            <a class="forgot-link" id="openForgotModal">Forgot Password?</a>
            <p id="errorMessage" style="color: #dc2626; margin-top: 12px; font-size: 13px; text-align: center; display: none;"></p>
        </form>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <span class="close-btn" id="closeForgotModal">&times;</span>
            <h3 style="margin-bottom: 15px; font-size: 18px; color: #1e293b;">Reset Password</h3>
            <form id="resetForm">
                <div class="form-group">
                    <label for="resetUsername">Username</label>
                    <input type="text" id="resetUsername" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                        <span class="toggle-pwd" id="toggleNewPassword">👁️</span>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="background-color: #16a34a;">Reset Password</button>
                <p id="resetMessage" style="margin-top: 10px; font-size: 13px; text-align: center; display: none;"></p>
            </form>
        </div>
    </div>

    <script>
        // Toggle Password Visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
        });

        const toggleNewPassword = document.getElementById('toggleNewPassword');
        const newPasswordInput = document.getElementById('newPassword');
        toggleNewPassword.addEventListener('click', () => {
            const type = newPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            newPasswordInput.setAttribute('type', type);
            toggleNewPassword.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Submit Login Form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = passwordInput.value;
            const errorMsg = document.getElementById('errorMessage');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = data.redirect || 'dashboard.html';
                } else {
                    errorMsg.textContent = data.message || 'Invalid username or password';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Server error. Please try again later.';
                errorMsg.style.display = 'block';
            }
        });

        // Modal Logic
        const forgotModal = document.getElementById('forgotModal');
        document.getElementById('openForgotModal').addEventListener('click', () => forgotModal.style.display = 'flex');
        document.getElementById('closeForgotModal').addEventListener('click', () => forgotModal.style.display = 'none');

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('resetUsername').value;
            const newPassword = newPasswordInput.value;
            const resetMsg = document.getElementById('resetMessage');

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, newPassword })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    resetMsg.style.color = '#16a34a';
                    resetMsg.textContent = 'Password reset successfully!';
                    resetMsg.style.display = 'block';
                    setTimeout(() => {
                        forgotModal.style.display = 'none';
                        resetMsg.style.display = 'none';
                    }, 2000);
                } else {
                    resetMsg.style.color = '#dc2626';
                    resetMsg.textContent = data.message || 'User not found';
                    resetMsg.style.display = 'block';
                }
            } catch (err) {
                resetMsg.style.color = '#dc2626';
                resetMsg.textContent = 'Failed to reset password.';
                resetMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
